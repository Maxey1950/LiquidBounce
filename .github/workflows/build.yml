name: Build

on:
  push:
    branches: [ legacy ]
  pull_request:
    branches: [ legacy ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 8
          cache: "gradle"

      - name: Build
        run: ./gradlew build

      - name: Prepare Artifact
        id: prepare
        run: |
          cd build/libs
          # Locate the jar file
          JAR=$(find . -name "liquidbounce-b*.jar" | head -n 1)
          echo "Found JAR: $JAR"
          
          # Create a clean directory for the zip
          mkdir -p ../../dist
          cp "$JAR" ../../dist/liquidbounce.jar
          
          # We can also save the version as an output if needed later
          echo "artifact_path=dist/liquidbounce.jar" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: liquidbounce-build-${{ github.run_number }}
          path: dist/liquidbounce.jar
          retention-days: 5
